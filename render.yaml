services:
  - type: web
    name: yieldpadel-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: API_V1_STR
        value: /api/v1
      - key: PROJECT_NAME
        value: Afluenc.IA | YieldPadel
      - key: HOLD_EXPIRATION_MINUTES
        value: 15
      - key: WHATSAPP_VERIFY_TOKEN
        value: yieldpadel_secret_token_2026