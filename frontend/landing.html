<!-- MODAL DE ACCESO AL CLUB (DISEÑO SAAS OSCURO PROFESIONAL) -->
  <div id="login-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/85 backdrop-blur-md hidden">
    <div class="relative w-full max-w-md bg-slate-900 border border-slate-700/80 rounded-3xl shadow-2xl p-6 sm:p-8 text-white z-10" style="background-color: #0f172a !important;">
      
      <!-- Botón cerrar (X) -->
      <button type="button" onclick="closeLoginModal()" class="absolute top-5 right-5 w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white flex items-center justify-center transition">
        ✕
      </button>

      <!-- Badge de seguridad -->
      <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 mb-3">
        <span>⚡</span> <span>Acceso Seguro Multi-Tenant</span>
      </div>

      <!-- Título -->
      <h3 class="text-2xl font-black tracking-tight text-white mb-1">Ingresar al Club</h3>
      <p class="text-xs text-slate-400 mb-6">Selecciona tu sede deportiva e ingresa al sistema operativo.</p>

      <!-- Formulario de acceso directo sin credenciales -->
      <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
        
        <!-- Selector de Sede -->
        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">Sede Deportiva / Club</label>
          <select id="login-club-select" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-400 transition" style="background-color: #1e293b !important; color: #ffffff !important;">
            <option value="1">Capital Pádel Club – Maloka</option>
            <option value="2">Bogotá Pádel Center</option>
            <option value="3">PadelTown Salitre</option>
          </select>
        </div>

        <!-- Usuario -->
        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">Usuario o Correo</label>
          <input type="text" id="login-username" value="admin" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-400 transition" style="background-color: #1e293b !important; color: #ffffff !important;">
        </div>

        <!-- Contraseña -->
        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">Contraseña</label>
          <input type="password" id="login-password" value="••••••••" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-400 transition" style="background-color: #1e293b !important; color: #ffffff !important;">
        </div>

        <!-- Botón Iniciar Sesión Directo -->
        <button type="submit" id="btn-do-login" class="w-full mt-2 py-3 px-4 bg-emerald-400 hover:bg-emerald-300 text-slate-950 font-black text-sm rounded-xl shadow-lg transition flex items-center justify-center gap-2">
          <span>Iniciar Sesión en el Club</span>
          <span>→</span>
        </button>
      </form>

      <!-- Accesos Rápidos de Prueba (1-Click) -->
      <div class="mt-6 pt-5 border-t border-slate-800">
        <div class="flex items-center justify-between text-xs text-slate-400 mb-2.5">
          <span>Accesos Rápidos:</span>
          <span class="text-emerald-400 font-semibold">1-Click Directo</span>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <button type="button" onclick="quickFillAndLogin('admin')" class="p-2.5 bg-slate-800/80 hover:bg-slate-800 border border-slate-700/60 rounded-xl text-left transition flex flex-col gap-0.5">
            <span class="text-xs font-bold text-white flex items-center gap-1">👑 Admin</span>
            <span class="text-[11px] text-slate-400">admin / admin123</span>
          </button>
          <button type="button" onclick="quickFillAndLogin('recepcion')" class="p-2.5 bg-slate-800/80 hover:bg-slate-800 border border-slate-700/60 rounded-xl text-left transition flex flex-col gap-0.5">
            <span class="text-xs font-bold text-white flex items-center gap-1">🎾 Recepción</span>
            <span class="text-[11px] text-slate-400">recepcion / recepcion123</span>
          </button>
        </div>
      </div>

    </div>
  </div>
